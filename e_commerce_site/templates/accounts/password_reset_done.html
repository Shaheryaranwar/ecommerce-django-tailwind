{% extends "base.html" %}

{% block title %}Email Sent — {{ store_name }}{% endblock %}

{% block content %}
<section class="container-x flex justify-center py-14 md:py-20">
  <div class="w-full max-w-md border border-linen bg-paper p-10 text-center">
    <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-moss/10">
      <i data-lucide="mail-check" class="h-7 w-7 text-moss"></i>
    </span>
    <h1 class="mt-5 font-display text-2xl text-bark">Check your inbox</h1>
    <p class="mt-3 text-sm leading-relaxed text-cocoa">
      If an account exists for that email, we've sent password reset instructions.
      In development, the email prints to the server console.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn-outline mt-8">Back to sign in</a>
  </div>
</section>
{% endblock %}
