{% extends "base.html" %}

{% block title %}Password Updated — {{ store_name }}{% endblock %}

{% block content %}
<section class="container-x flex justify-center py-14 md:py-20">
  <div class="w-full max-w-md border border-linen bg-paper p-10 text-center">
    <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-moss/10">
      <i data-lucide="shield-check" class="h-7 w-7 text-moss"></i>
    </span>
    <h1 class="mt-5 font-display text-2xl text-bark">Password updated</h1>
    <p class="mt-3 text-sm text-cocoa">You can now sign in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="btn-dark mt-8">Sign in</a>
  </div>
</section>
{% endblock %}
