{% extends "base.html" %}

{% block title %}Page Not Found — {{ store_name }}{% endblock %}

{% block content %}
<section class="container-x flex justify-center py-20 md:py-28">
  <div class="w-full max-w-lg border border-linen bg-paper p-12 text-center">
    <p class="font-display text-7xl text-linen">404</p>
    <h1 class="mt-4 font-display text-3xl text-bark">This page has moved out</h1>
    <p class="mt-3 text-sm leading-relaxed text-cocoa">
      The page you're looking for doesn't exist — but plenty of beautiful pieces do.
    </p>
    <div class="mt-8 flex flex-wrap justify-center gap-4">
      <a href="{% url 'core:home' %}" class="btn-dark">Back home</a>
      <a href="{% url 'products:product_list' %}" class="btn-outline">Browse the shop</a>
    </div>
  </div>
</section>
{% endblock %}
