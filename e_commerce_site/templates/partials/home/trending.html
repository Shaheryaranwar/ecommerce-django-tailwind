<section class="section-pad bg-paper">
  <div class="container-x">
    <div class="mb-10 flex flex-wrap items-end justify-between gap-4">
      <div>
        <p class="eyebrow">Most wanted</p>
        <h2 class="mt-3 font-display text-3xl text-bark md:text-4xl">{{ section.title|default:"Customer favourites" }}</h2>
      </div>
      <a href="{% url 'products:product_list' %}?is_bestseller=1" class="inline-flex items-center gap-2 text-[11px] font-bold uppercase tracking-[0.2em] text-bark transition-colors hover:text-clay">
        See all <i data-lucide="arrow-right" class="h-4 w-4"></i>
      </a>
    </div>
    <div class="grid grid-cols-2 gap-x-4 gap-y-10 lg:grid-cols-4">
      {% for product in section.products %}
        <div data-reveal>{% include "partials/product_card.html" %}</div>
      {% endfor %}
    </div>
  </div>
</section>
