<section class="section-pad">
  <div class="container-x">
    <div class="mb-10 flex flex-wrap items-end justify-between gap-4">
      <div>
        <p class="eyebrow">Shop by room</p>
        <h2 class="mt-3 font-display text-3xl text-bark md:text-4xl">{{ section.title|default:"Every room tells a story" }}</h2>
      </div>
      <a href="{% url 'products:product_list' %}" class="inline-flex items-center gap-2 text-[11px] font-bold uppercase tracking-[0.2em] text-bark transition-colors hover:text-clay">
        View everything <i data-lucide="arrow-right" class="h-4 w-4"></i>
      </a>
    </div>
    <div class="grid grid-cols-2 gap-3 sm:gap-5 lg:grid-cols-3">
      {% for category in section.categories %}
        <div data-reveal>{% include "partials/category_card.html" %}</div>
      {% endfor %}
    </div>
  </div>
</section>
